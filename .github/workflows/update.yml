name: 每日自动更新

# 串行化：同一工作流只允许一个 run 运行，其余排队。
# 关键修复：此前多个全量采集 run 并发推送 media.db 到 main，互相 non-fast-forward 拒绝
# -> 每个 run 在「提交数据库变更」步骤失败 -> 触发 GitHub 失败邮件。
# 串行化后，后启动的 run 在 checkout 时即已包含前一个 run 推送的 media.db，推送为快进合并，不再冲突。
concurrency:
  group: qinjin-collection
  cancel-in-progress: false

# 每天北京时间 03:30 自动增量采集 -> 生成 M3U/Web -> 生成途播 Jellyfin 数据 -> 部署 Cloudflare Pages -> 提交数据库
# 也可在 Actions 页面手动点击 Run workflow 立即执行一次
on:
  # 全量采集冲刺期已暂停定时触发（2026-09-05）：update 的 --pages 1 增量在全量未完成前
  # 毫无意义，且占用 qinjin-collection 并发组会拖慢 fast-collect 接力链。全量完成后取消注释恢复。
  # schedule:
  #   - cron: '30 19 * * *'   # UTC 19:30 = 北京时间 03:30
  workflow_dispatch:
    inputs:
      MODE:
        description: '采集模式：incremental=每日增量轮换；full=全量采集到最后一页'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      SOURCES:
        description: '仅 full 模式：指定源逗号分隔（如 最大,爱奇艺,魔都）；留空=全部直接源+配置中心源'
        required: false
        default: ''
      PAGE_START:
        description: '仅 full 模式：起始页码（断点续采，默认 1）'
        required: false
        default: '1'
      PAGE_CHUNK:
        description: '仅 full 模式：本次采集页数（避免 6h 超时；留空=采到最后一页）'
        required: false
        default: ''
      SKIP_COVERS:
        description: '跳过封面生成（大批量采集时为避免 6h 超时，可先跳过，后续每日运行再补）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 硬上限: 卡死时 GitHub 自动结束 run 并释放 qinjin-collection 并发组, 杜绝死锁永久阻塞全量采集
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 恢复 media.db（从 Release 资产，绕过 git 100MB 限制）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/db_store.py download

      - name: 增量采集（按天轮换，3 天一循环全覆盖）
        if: ${{ inputs.MODE != 'full' }}
        run: |
          # 19 个直接 API 源按天数分 3 组轮换，配置中心 4 个源(360/旺旺/如意/率率)每天都采
          DIRECT=("索尼" "金鹰" "红牛" "猫眼" "樱花" "非凡" "光速" "无尽" "速播" "极速" "火狐" "西瓜" "优酷" "百度" "豆瓣" "暴风" "星球" "量子" "茅台" "最大" "爱奇艺" "魔都")
          DAY=$(( $(date +%s) / 86400 ))
          GROUP=$(( DAY % 3 ))
          SELECTED=()
          i=0
          for s in "${DIRECT[@]}"; do
            if [ $(( i % 3 )) -eq $GROUP ]; then
              SELECTED+=("$s")
            fi
            i=$(( i + 1 ))
          done
          SOURCES="360,旺旺,如意,率率,$(IFS=,; echo "${SELECTED[*]}")"
          echo "本次采集源: $SOURCES"
          python main.py collect -n cc0cd --pages 1 --sources "$SOURCES"

      - name: 全量采集（分批，避免 6h 超时；指定 PAGE_START+PAGE_CHUNK 续采）
        if: ${{ inputs.MODE == 'full' }}
        run: |
          SRC=""
          if [ -n "${{ inputs.SOURCES }}" ]; then
            SRC="--sources ${{ inputs.SOURCES }}"
          fi
          START="${{ inputs.PAGE_START }}"
          CHUNK="${{ inputs.PAGE_CHUNK }}"
          START_FLAG=""
          PAGES_FLAG="--pages 0"
          if [ -n "$START" ] && [ "$START" != "0" ]; then
            START_FLAG="--start-page $START"
          fi
          if [ -n "$CHUNK" ] && [ "$CHUNK" != "0" ]; then
            PAGES_FLAG="--pages $CHUNK"
          fi
          echo "全量分批: 源=${{ inputs.SOURCES || '全部' }} start=${START:-1} chunk=${CHUNK:-全量}"
          python main.py collect -n cc0cd $PAGES_FLAG $START_FLAG $SRC --no-generate

      - name: 清理失效播放片源（链接健康检测，增量+安全阀）
        # 探测每条约播放 URL 的可达性，删除"确定死了"的链接（域名失联/连接拒绝/404/410）。
        # 保守策略：403/401/530/超时一律视为"不确定"跳过（靠本站中转常能救活，误删风险高）。
        # 增量：每次只检 --limit 条最久未检的 URL（配合每日运行逐步覆盖全库）；
        # --apply 真删，且单次删除比例上限 5%（疑似源站整体故障时中止，防误删）。
        run: |
          python scripts/prune_dead.py --apply --limit 5000 --age-days 3 --concurrency 16

      - name: 刷新播放线路域名体检表（供生成期剔除死链）
        # 按域名聚合所有播放地址，探测 direct/refer/proxy 三种取流方式可用性，写入
        # data/host_health.json。generate 据此把已知可用线路排前、全线已死的线路直接隐藏，
        # 从根上解决「点了播不了」。失败不阻断流水线（沿用上一份体检表）。
        continue-on-error: true
        run: |
          python scripts/check_source_health.py --workers 24 --min-urls 1 --samples 2

      - name: 采集直播源（聚合源下载 + 测速择优，全量刷新）
        env:
          WEB_STRICT_HEALTH: 1
        run: |
          python main.py collect-live --no-generate
          python main.py generate --txt --best

      - name: 采集直播台标到本地固定存储
        # 把每个直播频道的台标下载到 data/live_logos/（进 git 固定），部署时由 generate_covers 同步到
        # output/covers/live/。本机走代理、CI 直连；单条失败不影响其余。即便 CDN 不可达也只是缺少部分台标，
        # 不影响整体流水线，故设 continue-on-error。
        continue-on-error: true
        run: |
          python scripts/fetch_live_logos.py --workers 16

      - name: 生成途播 Jellyfin 后端数据（api/movies.json + 地区分片）
        # 关键：途播后端 worker 在运行时 fetch 此 JSON 渲染海报墙。
        # 此前工作流只生成 M3U/Web，从不生成它，导致途播每日更新“看似完成”实则数据没变。
        env:
          WEB_STRICT_HEALTH: 1
        run: |
          python generate_movies_json.py

      - name: 生成电影墙分类封面
        if: ${{ inputs.SKIP_COVERS != 'true' }}
        run: |
          python -m pip install -q pillow
          python scripts/generate_covers.py

      - name: 生成直连分流规则（来自 media.db，订阅自动更新）
        # 手机开 VPN 访问后端时让国内视频 CDN 直连；规则随采集数据每日刷新并提交，
        # Shadowrocket/Clash 订阅此文件即可自动获得最新源站域名。
        run: |
          python scripts/gen_direct_rules.py

      - name: 复制直连规则到站点（供 Shadowrocket/Clash 订阅，经 VPN 可达）
        run: |
          cp scripts/shadowrocket_direct_rules.list output/
          cp scripts/shadowrocket_direct_module.conf output/
          cp scripts/direct_rules_clash.yaml output/

      - name: 递增 DATA_VERSION（避免客户端/途播缓存旧数据）
        # worker 用 DATA_VERSION 做缓存键与查询参数；每次部署换新版，强制客户端拉取最新片源。
        run: |
          VER="$(date +%Y%m%d%H)"
          sed -i "s/const DATA_VERSION = \".*\";/const DATA_VERSION = \"$VER\";/" output/_worker.js
          echo "DATA_VERSION -> $VER"
          grep "DATA_VERSION =" output/_worker.js

      - name: 生成 _headers（M3U Content-Type 修正 + 禁止缓存）
        run: |
          cat > output/_headers <<'EOF'
          /movie.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /movie.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /live.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /live.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /*_full_part*.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /*_full_part*.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /shadowrocket_direct_module.conf
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /shadowrocket_direct_rules.list
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /direct_rules_clash.yaml
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /web/*
            Cache-Control: public, max-age=86400, stale-while-revalidate=604800
          /covers/*
            Cache-Control: public, max-age=86400, stale-while-revalidate=604800
          /index.html
            Cache-Control: max-age=0, must-revalidate
          EOF

      - name: 提交数据库变更（供下次增量采集去重）
        # ⚠️ 关键顺序修复：此前此步骤在「部署」之后，一旦部署失败(如 25MiB 超限)提交就不执行，
        # 采集到的数据全部丢失(白采)。现改为「采集+生成后立即提交，最后才部署」——
        # 即便部署出问题，数据已安全落库 main，下次重跑只需续采。
        # media.db 已移出 git（会涨过 100MB 触发 GH001 大文件拒绝），改由下方「上传 media.db」步骤存 Release 资产。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_logos/ data/host_health.json scripts/shadowrocket_direct_rules.list scripts/shadowrocket_direct_module.conf scripts/direct_rules_clash.yaml
          if git diff --cached --quiet; then
            echo "数据库无变化，跳过提交"
          else
            git commit -m "chore: 采集更新 $(date +%F)"
            # 并发推送保护：3 套工作流共用 qinjin-collection 串行组，但 CI 偶发竞态
            # （同一窗口内其他工作流/手动触发先推了 main），单次 push 会被 non-fast-forward 拒绝。
            # 用「拉取->合并->推送」重试环：每次推送前都重新同步远端，消除竞态窗口。
            # 始终 ff 推送，绝不强推，避免覆盖并发提交（含采集数据）。
            PUSHED=0
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git merge origin/main --no-edit; then
                if git push origin HEAD:main; then
                  echo "进度已推送（第 $i 次尝试）"
                  PUSHED=1
                  break
                fi
              else
                git merge --abort 2>/dev/null || true
              fi
              echo "第 $i 次推送遇竞态，2s 后重试..."
              sleep 2
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "::warning::进度文件推送失败（竞态次数过多），但 media.db 已存 Release 资产，不影响采集"
            fi
          fi

      - name: 上传 media.db 到 Release 资产（绕过 git 100MB 限制）
        # 把更新后的 media.db 存回 Release 资产（db-store / media.db），供下一轮 CI 拉回续跑。
        # 库 <5MB 时自动跳过，避免「下载失败→空库」误清空好库。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/db_store.py upload

      - name: 部署前体积闸门（Cloudflare Pages 单文件 25 MiB 硬上限）
        # 超限会导致【整个部署失败 + 站点回退到上次成功部署（表现为内容为空）】，
        # 因此在部署前就点名超限文件并直接失败，避免只能靠 wrangler 报错倒推。
        run: python scripts/check_output_size.py output

      - name: 部署到 Cloudflare Pages（裸域名 qinjin.pages.dev = 途播入口，由 main 分支提供）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 裸域名 qinjin.pages.dev 由 main 分支提供（途播实际使用的入口），必须部署到 main。
          # production 分支仅作别名/预览，顺带同步以保持一致。
          npx --yes wrangler@4 pages deploy output --project-name=qinjin --branch=main
          npx --yes wrangler@4 pages deploy output --project-name=qinjin --branch=production

      - name: 构建并部署分享站（带访问口令，独立项目 qs-agcl2）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python share/build.py
          npx --yes wrangler@4 pages deploy share/dist --project-name=qs-agcl2 --branch=main
