name: 每日自动更新

# 串行化：同一工作流只允许一个 run 运行，其余排队。
# 关键修复：此前多个全量采集 run 并发推送 media.db 到 main，互相 non-fast-forward 拒绝
# -> 每个 run 在「提交数据库变更」步骤失败 -> 触发 GitHub 失败邮件。
# 串行化后，后启动的 run 在 checkout 时即已包含前一个 run 推送的 media.db，推送为快进合并，不再冲突。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# 每天北京时间 03:30 自动增量采集 -> 生成 M3U/Web -> 生成途播 Jellyfin 数据 -> 部署 Cloudflare Pages -> 提交数据库
# 也可在 Actions 页面手动点击 Run workflow 立即执行一次
on:
  schedule:
    - cron: '30 19 * * *'   # UTC 19:30 = 北京时间 03:30
  workflow_dispatch:
    inputs:
      MODE:
        description: '采集模式：incremental=每日增量轮换；full=全量采集到最后一页'
        required: false
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
      SOURCES:
        description: '仅 full 模式：指定源逗号分隔（如 最大,爱奇艺,魔都）；留空=全部直接源+配置中心源'
        required: false
        default: ''
      PAGE_START:
        description: '仅 full 模式：起始页码（断点续采，默认 1）'
        required: false
        default: '1'
      PAGE_CHUNK:
        description: '仅 full 模式：本次采集页数（避免 6h 超时；留空=采到最后一页）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 增量采集（按天轮换，3 天一循环全覆盖）
        if: ${{ inputs.MODE != 'full' }}
        run: |
          # 19 个直接 API 源按天数分 3 组轮换，配置中心 4 个源(360/旺旺/如意/率率)每天都采
          DIRECT=("索尼" "金鹰" "红牛" "猫眼" "樱花" "非凡" "光速" "无尽" "速播" "极速" "火狐" "西瓜" "优酷" "百度" "豆瓣" "暴风" "星球" "量子" "茅台" "最大" "爱奇艺" "魔都")
          DAY=$(( $(date +%s) / 86400 ))
          GROUP=$(( DAY % 3 ))
          SELECTED=()
          i=0
          for s in "${DIRECT[@]}"; do
            if [ $(( i % 3 )) -eq $GROUP ]; then
              SELECTED+=("$s")
            fi
            i=$(( i + 1 ))
          done
          SOURCES="360,旺旺,如意,率率,$(IFS=,; echo "${SELECTED[*]}")"
          echo "本次采集源: $SOURCES"
          python main.py collect -n cc0cd --pages 1 --sources "$SOURCES"

      - name: 全量采集（分批，避免 6h 超时；指定 PAGE_START+PAGE_CHUNK 续采）
        if: ${{ inputs.MODE == 'full' }}
        run: |
          SRC=""
          if [ -n "${{ inputs.SOURCES }}" ]; then
            SRC="--sources ${{ inputs.SOURCES }}"
          fi
          START="${{ inputs.PAGE_START }}"
          CHUNK="${{ inputs.PAGE_CHUNK }}"
          START_FLAG=""
          PAGES_FLAG="--pages 0"
          if [ -n "$START" ] && [ "$START" != "0" ]; then
            START_FLAG="--start-page $START"
          fi
          if [ -n "$CHUNK" ] && [ "$CHUNK" != "0" ]; then
            PAGES_FLAG="--pages $CHUNK"
          fi
          echo "全量分批: 源=${{ inputs.SOURCES || '全部' }} start=${START:-1} chunk=${CHUNK:-全量}"
          python main.py collect -n cc0cd $PAGES_FLAG $START_FLAG $SRC --no-generate

      - name: 采集直播源（聚合源下载 + 测速择优，全量刷新）
        run: |
          python main.py collect-live --no-generate
          python main.py generate --txt --best

      - name: 生成途播 Jellyfin 后端数据（api/movies.json + 地区分片）
        # 关键：途播后端 worker 在运行时 fetch 此 JSON 渲染海报墙。
        # 此前工作流只生成 M3U/Web，从不生成它，导致途播每日更新“看似完成”实则数据没变。
        run: |
          python generate_movies_json.py

      - name: 生成电影墙分类封面
        run: |
          python -m pip install -q pillow
          python scripts/generate_covers.py

      - name: 递增 DATA_VERSION（避免客户端/途播缓存旧数据）
        # worker 用 DATA_VERSION 做缓存键与查询参数；每次部署换新版，强制客户端拉取最新片源。
        run: |
          VER="$(date +%Y%m%d%H)"
          sed -i "s/const DATA_VERSION = \".*\";/const DATA_VERSION = \"$VER\";/" output/_worker.js
          echo "DATA_VERSION -> $VER"
          grep "DATA_VERSION =" output/_worker.js

      - name: 生成 _headers（M3U Content-Type 修正 + 禁止缓存）
        run: |
          cat > output/_headers <<'EOF'
          /movie.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /movie.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /live.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /live.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /index.html
            Cache-Control: max-age=0, must-revalidate
          EOF

      - name: 部署到 Cloudflare Pages（裸域名 qinjin.pages.dev = 途播入口，由 main 分支提供）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 裸域名 qinjin.pages.dev 由 main 分支提供（途播实际使用的入口），必须部署到 main。
          # production 分支仅作别名/预览，顺带同步以保持一致。
          npx --yes wrangler@4 pages deploy output --project-name=qinjin --branch=main
          npx --yes wrangler@4 pages deploy output --project-name=qinjin --branch=production

      - name: 构建并部署分享站（带访问口令，独立项目 qs-agcl2）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python share/build.py
          npx --yes wrangler@4 pages deploy share/dist --project-name=qs-agcl2 --branch=main

      - name: 提交数据库变更（供下次增量采集去重）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media.db
          if git diff --cached --quiet; then
            echo "数据库无变化，跳过提交"
          else
            git commit -m "chore: 每日采集更新 $(date +%F)"
            # 串行化(concurrency)保证 checkout 即最新；拉取后快进合并再推送，杜绝 non-fast-forward 失败。
            # 极端情况下（与手动 dispatch 短暂重叠导致分叉）回退到 force-with-lease，仅覆盖生成的 media.db。
            git fetch origin main
            git merge origin/main --ff-only 2>/dev/null || true
            git push origin HEAD:main 2>/dev/null || git push --force-with-lease origin HEAD:main
          fi
