name: 每日自动更新

# 每天北京时间 03:30 自动增量采集 -> 生成 M3U -> 部署 Cloudflare Pages -> 提交数据库
# 也可在 Actions 页面手动点击 Run workflow 立即执行一次
on:
  schedule:
    - cron: '30 19 * * *'   # UTC 19:30 = 北京时间 03:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 增量采集（按天轮换，3 天一循环全覆盖）
        run: |
          # 19 个直接 API 源按天数分 3 组轮换，配置中心 4 个源(360/旺旺/如意/率率)每天都采
          DIRECT=("索尼" "金鹰" "红牛" "猫眼" "樱花" "非凡" "光速" "无尽" "速播" "极速" "火狐" "西瓜" "优酷" "百度" "豆瓣" "暴风" "星球" "量子" "茅台")
          DAY=$(( $(date +%s) / 86400 ))
          GROUP=$(( DAY % 3 ))
          SELECTED=()
          i=0
          for s in "${DIRECT[@]}"; do
            if [ $(( i % 3 )) -eq $GROUP ]; then
              SELECTED+=("$s")
            fi
            i=$(( i + 1 ))
          done
          SOURCES="360,旺旺,如意,率率,$(IFS=,; echo "${SELECTED[*]}")"
          echo "本次采集源: $SOURCES"
          python main.py collect -n cc0cd --pages 1 --sources "$SOURCES"

      - name: 采集直播源（聚合源下载 + 测速择优，全量刷新）
        run: |
          python main.py collect-live --no-generate
          python main.py generate --txt --best

      - name: 生成 _headers（M3U Content-Type 修正 + 禁止缓存）
        run: |
          cat > output/_headers <<'EOF'
          /movie.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /movie.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /live.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /live.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /index.html
            Cache-Control: max-age=0, must-revalidate
          EOF

      - name: 部署到 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy output --project-name=qinjin --branch=production

      - name: 构建并部署分享站（带访问口令，独立项目 qs-agcl2）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python share/build.py
          npx --yes wrangler@4 pages deploy share/dist --project-name=qs-agcl2 --branch=main

      - name: 提交数据库变更（供下次增量采集去重）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media.db
          if git diff --cached --quiet; then
            echo "数据库无变化，跳过提交"
          else
            git commit -m "chore: 每日采集更新 $(date +%F)"
            # checkout 后处于 detached HEAD，显式推送到 main 分支
            git push origin HEAD:main
          fi
