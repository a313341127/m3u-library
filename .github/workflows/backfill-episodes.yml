name: 分集回填（自动）

# 目标：把 episodes(分集) 刷进老数据。源站对电视剧本来就返回完整分集，只是 2026-08-31
# 之前全量回填的大批老数据没采分集。本工作流每天自动分批全量重采 tv/anime/variety，
# 进度存 data/backfill_progress.json 断点续跑，跑完自动停止，全程无需人工介入。
#
# ⚠️ 2026-09-18 精简：本工作流**只负责「回填 episodes + 落盘进度/库」**。
#    前端的生成(movies.json)/封面/_headers/DATA_VERSION/部署 Cloudflare/分享站等重活
#    由 deploy.yml 每日 03:00 UTC 统一重生成并部署，会自动吃掉本轮新增的 episodes，
#    无需本工作流重复做（重复做既烧时间又增加撞超时/推送竞态的概率）。
#    这样 backfill_run.py 一返回，立刻「上传 media.db + 提交进度」收尾，整体稳稳低于
#    360min 超时，根除「超时取消→进度全丢→看门狗计失败→重投→又超时」的死循环。

concurrency:
  group: qinjin-backfill
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 4 * * *'   # UTC 04:00 = 北京时间 12:00
  repository_dispatch:
    types: [backfill-episodes]   # 可由 API(PAT 仅需 repo 权限) 立即触发，无需点、不占本机
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 360（6h，GitHub 单 job 上限）：时间预算由 backfill_run.py 的 TIME_BUDGET_MIN 控制
    # （默认 240，单源 SRC_BUDGET_MIN 默认 120）。脚本到点会 kill 子进程并立即返回，
    # 留足余量给下方「上传 media.db + 提交进度」。
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 恢复 media.db（从 Release 资产，绕过 git 100MB 限制）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/db_store.py download

      - name: 分集回填（分批全量重采 tv/anime/variety，断点续跑）
        # 脚本自管进度(data/backfill_progress.json)，到点强杀在跑子进程并立即返回。
        run: |
          python scripts/backfill_run.py

      - name: 落盘分集回填进度 + media.db（防超时丢失断点）
        # 关键：backfill_run.py 一返回立刻上传 media.db 并提交流度，不做任何后处理。
        # ⚠️ 必须「进度 JSON + media.db 上传」成对落盘：只提交 JSON 而库没上传，下一轮
        # db_store download 会拉回旧库，本轮新增的分集照样全部丢失。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/db_store.py upload
          git add data/backfill_progress.json
          if git diff --cached --quiet; then
            echo "进度无变化，跳过提交"
          else
            git commit -m "chore: 分集回填进度落盘 $(date +%F' '%H:%M)"
            PUSHED=0
            for i in 1 2 3 4 5; do
              git fetch origin main || true
              if git merge origin/main --no-edit; then
                if git push origin HEAD:main; then
                  echo "进度已推送（第 $i 次尝试）"
                  PUSHED=1
                  break
                fi
              else
                git merge --abort 2>/dev/null || true
              fi
              echo "第 $i 次推送遇竞态，2s 后重试..."
              sleep 2
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "::warning::进度推送失败（竞态过多），media.db 已存 Release 资产，下轮续跑"
            fi
          fi
