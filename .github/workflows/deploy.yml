name: 部署（仅生成+发布，不采集）

# 适用于：本地/CI 已完成采集（media.db 已就绪），只需把当前数据重新生成并部署到 Cloudflare Pages。
# 手动在 Actions 页面 Run workflow 触发；也可被其他流程调用。
on:
  workflow_dispatch:
    inputs:
      REGEN_COVERS:
        description: '是否重新生成分类封面（耗时但修字体/封面问题时用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  # 推送代码（非数据）变更时自动部署，使网页/worker 改动即时上线；
  # 仅 data/media.db 的数据推送（来自采集定时任务）不匹配 paths，不触发，避免重复部署。
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - 'collector/**'
      - 'core/**'
      - 'scripts/**'
      - 'config.py'
      - 'main.py'
      - 'generate_movies_json.py'
      - 'output/_worker.js'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

# 串行化：与「每日自动更新」「分集回填」共用并发组 qinjin-collection，
# 避免本工作流（push 触发）与带库部署互相踩踏。
# 关键修复：此前本工作流既不在并发组、又缺少 db 下载步骤，
# push 代码时直接用空库（media.db 被 gitignore，全新检出为空）覆盖线上，
# 导致途播 Jellyfin 后端 / 网页数据被清空。现已从 Release 资产恢复 media.db 再生成。
concurrency:
  group: qinjin-collection
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 恢复 media.db（从 Release 资产，绕过 git 100MB 限制）
        # 关键修复：media.db 被 gitignore，全新检出为空。本工作流此前无此步，
        # 直接用空库 generate 并部署，把途播/网页数据清空。现先拉回生产库再生成。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/db_store.py download

      - name: 生成 M3U / Web / 途播 Jellyfin 分片数据
        env:
          WEB_STRICT_HEALTH: 1
        run: |
          python main.py generate --txt --best
          python generate_movies_json.py

      - name: 生成电影墙分类封面 + 直播台标
        # 封面是部署产物的一部分（途播分类视图 + 直播频道台标均依赖），必须每次都生成，
        # 不可因 REGEN_COVERS=false 跳过，否则直播频道封面空白。
        run: |
          python -m pip install -q pillow
          python scripts/generate_covers.py

      - name: 生成直连分流规则（来自 media.db，自动覆盖新 CDN 子域）
        # 手机开 VPN 访问 qinjin.pages.dev 后端时，让国内视频 CDN 走直连。
        # 规则从 media.db 现抽现生成，源站换子域也能自动命中，不再手写维护。
        run: |
          python scripts/gen_direct_rules.py

      - name: 复制直连规则到站点（供 Shadowrocket/Clash 订阅，经 VPN 可达）
        run: |
          cp scripts/shadowrocket_direct_rules.list output/
          cp scripts/shadowrocket_direct_module.conf output/
          cp scripts/direct_rules_clash.yaml output/

      - name: 递增 DATA_VERSION（避免客户端/途播缓存旧数据）
        run: |
          VER="$(date +%Y%m%d%H)"
          sed -i "s/const DATA_VERSION = \".*\";/const DATA_VERSION = \"$VER\";/" output/_worker.js
          echo "DATA_VERSION -> $VER"
          grep "DATA_VERSION =" output/_worker.js

      - name: 生成 _headers（M3U Content-Type 修正 + 禁止缓存）
        run: |
          cat > output/_headers <<'EOF'
          /movie.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /movie.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /tv.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /anime.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /variety.best.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /movie.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /tv.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /anime.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /variety.best.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /live.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /live.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /*_full_part*.m3u
            Content-Type: application/vnd.apple.mpegurl
            Cache-Control: max-age=0, must-revalidate
          /*_full_part*.txt
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /shadowrocket_direct_module.conf
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /shadowrocket_direct_rules.list
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /direct_rules_clash.yaml
            Content-Type: text/plain; charset=utf-8
            Cache-Control: max-age=0, must-revalidate
          /index.html
            Cache-Control: max-age=0, must-revalidate
          EOF

      - name: 部署到 Cloudflare Pages（裸域名 qinjin.pages.dev = 途播入口，由 main 分支提供）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy output --project-name=qinjin --branch=main
          npx --yes wrangler@4 pages deploy output --project-name=qinjin --branch=production

      - name: 构建并部署分享站（带访问口令，独立项目 qs-agcl2）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python share/build.py
          npx --yes wrangler@4 pages deploy share/dist --project-name=qs-agcl2 --branch=main
