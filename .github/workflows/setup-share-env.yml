name: 配置分享站环境变量

# 用途：给 qs-agcl2（零 KV 分享站）Pages 项目写入运行期环境变量，
# 使管理员在 /__admin 生成的邀请码能经 GitHub Contents API 写回仓库 share/codes.json。
# 手动在 Actions 页面 Run workflow 触发。
#
# 机制（已验证的路径）：Pages Functions 运行期变量用 wrangler.toml 的 [vars] 在部署时注入最可靠。
# GITHUB_TOKEN 由 secrets.SHARE_GITHUB_PAT 在 CI 内展开写入生成的 wrangler.toml，不入库、不进 git。
# 依赖 Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（已有）、SHARE_GITHUB_PAT（已存入，值为有 repo 权限的 PAT）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 构建并写入运行期环境变量（wrangler.toml [vars] 部署时注入）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHARE_GITHUB_PAT: ${{ secrets.SHARE_GITHUB_PAT }}
        run: |
          python share/build.py
          # 生成 wrangler.toml（含运行期变量），仅存在于 CI，不入库；[vars] 是 Pages Functions 运行期变量规范写法
          cat > share/dist/wrangler.toml <<'WFEOF'
          name = "qs-agcl2"
          [vars]
          GITHUB_REPO = "a313341127/m3u-library"
          MIGRATE_FROM_KV = "0"
          GITHUB_TOKEN = "${{ secrets.SHARE_GITHUB_PAT }}"
          WFEOF
          cd share/dist && npx --yes wrangler@4 pages deploy . --project-name=qs-agcl2 --branch=main
